# Render blueprint — Orbit API (FastAPI)
# Docs: https://render.com/docs/blueprint-spec
#
# Frontend deploys separately on Vercel (see vercel.json + README).
# After the first deploy, set CORS_ORIGINS to your Vercel URL.

services:
  - type: web
    name: orbit-api
    runtime: python
    # Current plan ID for the 0.5 CPU / 512 MB "Starter" tier (legacy alias
    # "starter" is no longer accepted by the blueprint spec).
    plan: 0.5c-512mb
    region: oregon
    # Deps only — the disk is not mounted yet during the build phase.
    # --no-cache-dir: Render's persisted pip cache contained a corrupted
    # nvidia-cudnn wheel that failed hash verification on every build.
    buildCommand: cd backend && pip install --no-cache-dir --require-hashes -r requirements.txt
    # Migration runs at start (after the disk mounts) with storage dirs created.
    startCommand: cd backend && mkdir -p /var/data /var/data/uploads /var/data/chroma && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Seeds the NovaTech demo tenant (folders + 3 accounts) on first launch.
      # Set to "false" for a real deployment.
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/orbit.db
      - key: CHROMA_PATH
        value: /var/data/chroma
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Comma-separated list, e.g. https://orbit.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Shared with the retry cron job below; the cron authenticates with
      # "Authorization: Bearer <CRON_SECRET>" against POST /documents/retry-pending.
      - key: CRON_SECRET
        generateValue: true
      # Embed via the Gemini API so the process never loads torch on the
      # 512MB instance (indexing peak drops well below the limit).
      - key: EMBEDDING_PROVIDER
        value: gemini
      # Never silently load torch on the 512MB instance: if the Gemini API
      # fails, indexing records an error instead of OOM-crashing the process.
      - key: EMBEDDING_FALLBACK
        value: none
    disk:
      name: orbit-data
      mountPath: /var/data
      sizeGB: 1

  # Background retry for quota-parked documents (status=pending_retry).
  # Every 10 minutes: POST /api/documents/retry-pending, which re-indexes
  # pending documents one-by-one and keeps them parked on a fresh 429.
  - type: cron
    name: orbit-retry-pending
    runtime: python
    # Smallest compute plan; cron billing is usage-based with a $1/mo minimum.
    plan: 0.5c-512mb
    region: oregon
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS --max-time 60 -X POST
      -H "Authorization: Bearer ${CRON_SECRET}"
      "https://${API_HOSTNAME}/api/documents/retry-pending"
    envVars:
      - key: CRON_SECRET
        fromService:
          name: orbit-api
          type: web
          envVarKey: CRON_SECRET
      - key: API_HOSTNAME
        fromService:
          name: orbit-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
